spring.application.name=backend

# Database Configuration (Supabase PostgreSQL Cloud Database)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres.sechgzxyxslvcmcrpaxk}
spring.datasource.password=${DB_PASSWORD:nbUwPFBbfq71Vix5}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,*}

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Resend Configuration
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:noreply@nvshop.lk}

# Sri Lanka SMS Gateway Configuration (Notify.lk Live Integration)
sms.user.id=${SMS_USER_ID:}
sms.api.key=${SMS_API_KEY:}
sms.sender.id=${SMS_SENDER_ID:NotifyDEMO}
sms.provider.url=${SMS_PROVIDER_URL:https://app.notify.lk/api/v1/send}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.back_end=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.url=https://api.openai.com/v1/chat/completions

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# Groq Cloud LLM Configuration (Ultra-fast inference: qwen/qwen3.8-27b)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
groq.url=https://api.groq.com/openai/v1/chat/completions

