spring.application.name=backend

# XAMPP MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/gpsd_project?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=thenujaya12345

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=${SERVER_PORT:8080}

# Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Resend Configuration
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:noreply@nvshop.lk}

# Sri Lanka SMS Gateway Configuration (Notify.lk Live Integration)
sms.user.id=${SMS_USER_ID:}
sms.api.key=${SMS_API_KEY:}
sms.sender.id=${SMS_SENDER_ID:NotifyDEMO}
sms.provider.url=${SMS_PROVIDER_URL:https://app.notify.lk/api/v1/send}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.back_end=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.url=https://api.openai.com/v1/chat/completions

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
